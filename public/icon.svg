<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />

  <!-- Factory / Paper Roll Emblem -->
  <!-- Outer Paper Reel / Roll -->
  <circle cx="256" cy="220" r="130" fill="url(#emeraldGrad)" filter="url(#glow)" fill-opacity="0.25" />
  <ellipse cx="256" cy="220" rx="115" ry="115" stroke="url(#emeraldGrad)" stroke-width="14" fill="#0f172a" />
  
  <!-- Spiral Roll Lines -->
  <path d="M 256 120 A 100 100 0 0 1 356 220 A 85 85 0 0 1 256 305 A 70 70 0 0 1 186 220 A 55 55 0 0 1 256 165 A 40 40 0 0 1 296 220" 
        stroke="#34d399" stroke-width="9" stroke-linecap="round" fill="none" />
  
  <!-- Core Amber Ring -->
  <circle cx="256" cy="220" r="22" fill="url(#goldGrad)" />
  <circle cx="256" cy="220" r="10" fill="#0f172a" />

  <!-- Monogram RS in bold typography -->
  <text x="256" y="410" font-family="'Inter', -apple-system, sans-serif" font-size="78" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    RS PAPER
  </text>

  <!-- Subtitle accent bar -->
  <rect x="180" y="435" width="152" height="6" rx="3" fill="#10b981" />
</svg>
