<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background gradient: dark navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1a2e44" />
    </linearGradient>

    <!-- Paper roll body gradient (light warm white) -->
    <linearGradient id="paperLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0bec5" />
      <stop offset="30%" stop-color="#eceff1" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cfd8dc" />
    </linearGradient>

    <!-- Roll end-face (ellipse) gradient -->
    <radialGradient id="rollFace" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#eceff1" />
      <stop offset="75%" stop-color="#b0bec5" />
      <stop offset="100%" stop-color="#78909c" />
    </radialGradient>

    <!-- Roll core hole -->
    <radialGradient id="coreHole" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#37474f" />
      <stop offset="70%" stop-color="#263238" />
      <stop offset="100%" stop-color="#1a2e44" />
    </radialGradient>

    <!-- Emerald accent gradient -->
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="shadowSoft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- ── App icon container: rounded rect background ── -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Subtle emerald border ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#10b981" stroke-width="5" stroke-opacity="0.35" fill="none" />

  <!-- ══════════════════════════════════════════
       STACKED PAPER ROLLS  (inspired by photo)
       Layout mirrors the image:
         Row 1 (bottom): 3 rolls  side-by-side
         Row 2 (middle): 2 rolls  nestled above gaps
         Row 3 (top):    1 roll   centred at top
       Each roll = a horizontal cylinder:
         - rect body with paper gradient
         - left & right ellipse end-faces
         - small inner core ellipse
       ══════════════════════════════════════════ -->

  <!-- ─── Helper macros implemented inline per roll ─── -->
  <!-- Roll dimensions: width=134, height=58, endRx=22, endRy=29 -->

  <!-- ════════ ROW 1 — Bottom three rolls ════════ -->

  <!-- Roll B1 (bottom-left) : body x=30, y=300 -->
  <g filter="url(#shadow)">
    <rect x="50" y="302" width="130" height="56" fill="url(#paperLight)" />
    <!-- left end face -->
    <ellipse cx="50" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <!-- right end face -->
    <ellipse cx="180" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <!-- core hole left -->
    <ellipse cx="50" cy="330" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- Roll B2 (bottom-centre) : body x=191, y=300 -->
  <g filter="url(#shadow)">
    <rect x="191" y="302" width="130" height="56" fill="url(#paperLight)" />
    <ellipse cx="191" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="321" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="191" cy="330" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- Roll B3 (bottom-right) : body x=332, y=300 -->
  <g filter="url(#shadow)">
    <rect x="332" y="302" width="130" height="56" fill="url(#paperLight)" />
    <ellipse cx="332" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="462" cy="330" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="332" cy="330" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- ════════ ROW 2 — Middle two rolls ════════ -->
  <!-- nestled in the gaps between bottom rolls, raised ~52px -->

  <!-- Roll M1 (mid-left): centred between B1 and B2 -->
  <g filter="url(#shadowSoft)">
    <rect x="120" y="248" width="130" height="56" fill="url(#paperLight)" />
    <ellipse cx="120" cy="276" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="250" cy="276" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="120" cy="276" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- Roll M2 (mid-right): centred between B2 and B3 -->
  <g filter="url(#shadowSoft)">
    <rect x="262" y="248" width="130" height="56" fill="url(#paperLight)" />
    <ellipse cx="262" cy="276" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="392" cy="276" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="262" cy="276" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- ════════ ROW 3 — Top single roll ════════ -->
  <!-- centred above the two middle rolls, raised ~52px -->

  <g filter="url(#shadowSoft)">
    <rect x="191" y="193" width="130" height="56" fill="url(#paperLight)" />
    <ellipse cx="191" cy="221" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="321" cy="221" rx="20" ry="28" fill="url(#rollFace)" />
    <ellipse cx="191" cy="221" rx="7" ry="9" fill="url(#coreHole)" />
  </g>

  <!-- ─── Emerald ground shadow / base line ─── -->
  <ellipse cx="256" cy="368" rx="205" ry="12" fill="#000000" fill-opacity="0.25" />

  <!-- ════════ Branding text block at bottom ════════ -->
  <!-- Company initial pill -->
  <rect x="201" y="392" width="110" height="40" rx="20" fill="url(#emeraldAccent)" />
  <text x="256" y="421" font-family="'Inter','Arial Black',sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RS</text>

  <!-- Full name below -->
  <text x="256" y="462" font-family="'Inter',Arial,sans-serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">PAPER</text>

  <!-- Thin emerald underline accent -->
  <rect x="196" y="470" width="120" height="4" rx="2" fill="#10b981" fill-opacity="0.8" />
</svg>
